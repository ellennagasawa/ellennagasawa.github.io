name: Scrape Talk Locations

on:
  workflow_dispatch:

  push:
    paths:
      - "_talks/**"
      - "talkmap.ipynb"
      - ".github/workflows/scrape_talks.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter pandas requests beautifulsoup4 geopy getorg python-frontmatter

      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute talkmap.ipynb \
            --output talkmap_out.ipynb \
            --ExecutePreprocessor.timeout=600

      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update talk map"
          git push
